# Secrets come from jenkins/.env (git-ignored). Rotate = edit .env, `docker compose up -d`.
services:
  jenkins:
    build: .
    container_name: jenkins
    ports: ["8080:8080"]
    env_file: .env
    volumes: [jenkins_home:/var/jenkins_home]
    deploy: {resources: {limits: {memory: 1536M, cpus: "1.0"}}}   # bounded: Docker builds can't starve it
    healthcheck: {test: ["CMD","curl","-fs","http://localhost:8080/login"], interval: 30s, timeout: 5s, retries: 10, start_period: 60s}
    restart: unless-stopped
  agent:
    build: {context: ., dockerfile: agent.Dockerfile}
    container_name: jenkins-agent
    network_mode: host                 # reaches k3s API on 127.0.0.1:6443 and Jenkins on localhost:8080
    user: root
    environment:
      JENKINS_URL: http://localhost:8080
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${AGENT_SECRET}
      JENKINS_WEB_SOCKET: "true"
      KUBECONFIG: /kube/config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/rancher/k3s/k3s.yaml:/kube/config:ro
    deploy: {resources: {limits: {memory: 1G, cpus: "1.0"}}}
    depends_on: {jenkins: {condition: service_healthy}}
    restart: unless-stopped            # offline agents come back by themselves
volumes:
  jenkins_home:
