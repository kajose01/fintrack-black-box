# FIXED version. The secret `mongo-credentials` is created by scripts/deploy-all.sh and never lives in git.
apiVersion: v1
kind: Service
metadata: {name: mongodb, namespace: fintrack}
spec:
  clusterIP: None
  selector: {app: mongo}
  ports: [{port: 27017, name: mongo}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo, namespace: fintrack}
spec:
  serviceName: mongodb
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata:
      labels: {app: mongo}
      annotations: {sidecar.istio.io/inject: "false"}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:   # 'preferred', not 'required' (required => Pending on a small cluster)
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: mongo}}
      containers:
      - name: mongo
        image: mongo:7
        args: ["--wiredTigerCacheSizeGB", "0.25"]
        ports: [{containerPort: 27017}]
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom: {secretKeyRef: {name: mongo-credentials, key: username}}
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: mongo-credentials, key: password}}
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {cpu: "1", memory: 768Mi}
        readinessProbe: {tcpSocket: {port: 27017}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {tcpSocket: {port: 27017}, initialDelaySeconds: 30, periodSeconds: 20}
        volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path        # must exist: kubectl get storageclass
      resources: {requests: {storage: 2Gi}}
