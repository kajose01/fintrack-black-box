apiVersion: v1
kind: Service
metadata: {name: account-service, namespace: fintrack, labels: {app: account-service}}
spec:
  selector: {app: account-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service-v1
  namespace: fintrack
  labels: {app: account-service, version: v1}
spec:
  replicas: 3
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120      # fail fast instead of hanging
  minReadySeconds: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: account-service, version: v1}
  template:
    metadata:
      labels: {app: account-service, version: v1}     # 'version' label MUST match the Istio DestinationRule subsets
      annotations:
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyCPULimit: "300m"
        sidecar.istio.io/proxyMemoryLimit: "160Mi"
    spec:
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: account-service}}
      containers:
      - name: app
        image: fintrack/app:v1
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8080}]
        env:
        - {name: SERVICE, value: "account-service"}
        - {name: VERSION, value: "v1"}
        - {name: UPSTREAM, value: "http://payment-service:8080"}
        - {name: FEATURE_NEW_FLOW, value: "false"}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
