  template:
    metadata:
      labels: {app: account-service, version: v2}     # 'version' label MUST match the Istio DestinationRule subsets
      annotations:
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyCPULimit: "300m"
        sidecar.istio.io/proxyMemoryLimit: "160Mi"
    spec:
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: account-service}}
