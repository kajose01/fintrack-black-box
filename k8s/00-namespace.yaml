apiVersion: v1
kind: Namespace
metadata:
  name: fintrack
  labels: {istio-injection: enabled}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: fintrack-quota, namespace: fintrack}
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "8"
    limits.memory: 6Gi
    pods: "30"
    persistentvolumeclaims: "3"
---
apiVersion: v1
kind: LimitRange
metadata: {name: fintrack-defaults, namespace: fintrack}
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 50m, memory: 64Mi}
    default: {cpu: 300m, memory: 256Mi}
    max: {memory: 1Gi}
