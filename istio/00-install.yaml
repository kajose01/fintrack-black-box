apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: default
  meshConfig:
    enableTracing: true
    extensionProviders:
    - name: jaeger
      zipkin: {service: jaeger-collector.istio-system.svc.cluster.local, port: 9411}
  components:
    pilot:
      k8s: {resources: {requests: {cpu: 100m, memory: 256Mi}}}
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        service:
          type: NodePort
          ports:
          - {name: http2, port: 80, targetPort: 8080, nodePort: 30090}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
