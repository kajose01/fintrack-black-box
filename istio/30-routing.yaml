# Phase 4.2 / 4.3: 90/10 canary, retries (2) + timeout (3s) on every service, circuit breaker on payment-service
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: frontend, namespace: fintrack}
spec:
  hosts: ["*"]
  gateways: [fintrack-gw]
  http:
  - route: [{destination: {host: frontend, port: {number: 8080}}}]
    timeout: 3s
    retries: {attempts: 2, perTryTimeout: 1s, retryOn: "5xx,reset,connect-failure,refused-stream"}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: account-service, namespace: fintrack}
spec:
  hosts: [account-service]
  http:
  - route:
    - {destination: {host: account-service, subset: v1}, weight: 90}
    - {destination: {host: account-service, subset: v2}, weight: 10}
    timeout: 3s
    retries: {attempts: 2, perTryTimeout: 1s, retryOn: "5xx,reset,connect-failure,refused-stream"}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: account-service, namespace: fintrack}
spec:
  host: account-service
  trafficPolicy: {tls: {mode: ISTIO_MUTUAL}}
  subsets:                       # these labels must equal the pod 'version' label (the canary bug lives here)
  - {name: v1, labels: {version: v1}}
  - {name: v2, labels: {version: v2}}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: payment-service, namespace: fintrack}
spec:
  hosts: [payment-service]
  http:
  - route: [{destination: {host: payment-service}}]
    timeout: 3s
    retries: {attempts: 2, perTryTimeout: 1s, retryOn: "5xx,reset,connect-failure,refused-stream"}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: payment-service, namespace: fintrack}
spec:
  host: payment-service
  trafficPolicy:
    tls: {mode: ISTIO_MUTUAL}
    connectionPool:
      tcp: {maxConnections: 100}
      http: {http1MaxPendingRequests: 50, maxRequestsPerConnection: 10}
    outlierDetection:            # circuit breaker: 5 consecutive 5xx -> eject pod for 60s
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: frontend, namespace: fintrack}
spec:
  host: frontend
  trafficPolicy: {tls: {mode: ISTIO_MUTUAL}}
